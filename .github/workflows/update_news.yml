name: Update News Feed

on:
  schedule:
    - cron: '7,22,37,52 * * * *'  # ירוץ כל 15 דקות אבל בדקות 7, 22, 37, 52 (עוקף את העומס ב-GitHub)
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch News
        run: python fetch_news.py

      - name: Commit and Push Updated news.json
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add news.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update news.json [skip ci]" && git push)
